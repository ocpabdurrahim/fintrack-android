name: Web

# Type-checks, tests and builds the web app whenever it changes.
on:
  push:
    branches: [main]
    paths: ['web/**', 'firebase.json', 'firestore.rules', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'firebase.json', 'firestore.rules', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 7

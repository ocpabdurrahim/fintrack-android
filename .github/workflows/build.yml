name: Build

# Every push: unit tests, debug + release APKs, then the app is run on an
# Android 14 emulator (UI tests, screenshots, release-build smoke test).
# Pushing a tag like v1.0.0 also publishes a GitHub release with the APK.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FIN_KEYSTORE_BASE64: ${{ secrets.FIN_KEYSTORE_BASE64 }}
      FIN_KEYSTORE_PASSWORD: ${{ secrets.FIN_KEYSTORE_PASSWORD }}
      FIN_KEY_ALIAS: ${{ secrets.FIN_KEY_ALIAS }}
      FIN_KEY_PASSWORD: ${{ secrets.FIN_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Without the secrets (e.g. a fork) the release APK is debug-signed instead.
      - name: Restore the release signing key
        if: env.FIN_KEYSTORE_BASE64 != ''
        run: |
          echo "$FIN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fin-release.jks"
          echo "FIN_KEYSTORE_FILE=$RUNNER_TEMP/fin-release.jks" >> "$GITHUB_ENV"

      - name: Unit tests and APKs
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace testDebugUnitTest assembleDebug assembleDebugAndroidTest assembleRelease

      - name: Name the release APK
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/FinTrack-$version.apk"
          ls -l dist
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs dist/*.apk | head -n 3

      - uses: actions/upload-artifact@v4
        with:
          name: FinTrack-apk
          path: dist/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: test-apks
          retention-days: 7
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            app/build/outputs/apk/release/app-release.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: app/build/reports/

      # The exported Room schema; commit it whenever the database version changes.
      - uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: ignore

  emulator:
    name: Emulator tests and screenshots
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: test-apks
          path: apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/emulator-checks.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: emulator-out/

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, emulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: FinTrack-apk
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --title "FinTrack $GITHUB_REF_NAME" \
            --notes-file docs/release-notes.md

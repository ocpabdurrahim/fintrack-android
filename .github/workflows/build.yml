name: Build

# Every push: unit tests, debug + release APKs, then the app is run on an
# Android 14 emulator (UI tests, screenshots, release-build smoke test).
# Pushing a tag like v1.0.0 also publishes a GitHub release with the APK.
on:
  push:
    branches: [main]
    tags: ['v*']
    # Web-only changes are built by web.yml. (Tag pushes ignore path filters.)
    paths-ignore: ['web/**', 'docs/**', 'firebase.json', 'firestore.rules', 'firestore.indexes.json', '.github/workflows/web.yml']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FIN_KEYSTORE_BASE64: ${{ secrets.FIN_KEYSTORE_BASE64 }}
      FIN_KEYSTORE_PASSWORD: ${{ secrets.FIN_KEYSTORE_PASSWORD }}
      FIN_KEY_ALIAS: ${{ secrets.FIN_KEY_ALIAS }}
      FIN_KEY_PASSWORD: ${{ secrets.FIN_KEY_PASSWORD }}
      FIREBASE_GOOGLE_SERVICES: ${{ secrets.FIREBASE_GOOGLE_SERVICES }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Without the secrets (e.g. a fork) the release APK is debug-signed instead.
      - name: Restore the release signing key
        if: env.FIN_KEYSTORE_BASE64 != ''
        run: |
          echo "$FIN_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fin-release.jks"
          echo "FIN_KEYSTORE_FILE=$RUNNER_TEMP/fin-release.jks" >> "$GITHUB_ENV"

      - name: Firebase config
        run: bash .github/scripts/google-services.sh

      # Debug builds talk to the Firebase emulators the test job runs (10.0.2.2 = the host).
      - name: Unit tests and APKs
        run: |
          chmod +x gradlew
          TEST_PROPS="-PfirebaseEmulatorHost=10.0.2.2 -PupdateApiUrl=http://10.0.2.2:8000/latest.json"
          ./gradlew --stacktrace $TEST_PROPS testDebugUnitTest assembleDebug assembleDebugAndroidTest assembleRelease
          # A "newer" copy of the debug app for the self-update test.
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/app-debug.apk"
          ./gradlew $TEST_PROPS -PversionCodeOverride=9999 -PversionNameOverride=99.0.0 assembleDebug
          mkdir -p app/build/outputs/apk/update
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/update/FinTrack-99.0.0.apk
          cp "$RUNNER_TEMP/app-debug.apk" app/build/outputs/apk/debug/app-debug.apk

      - name: Name the release APK
        run: |
          version=$(sed -n 's/^val appVersionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/FinTrack-$version.apk"
          ls -l dist
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs dist/*.apk | head -n 3

      - uses: actions/upload-artifact@v4
        with:
          name: FinTrack-apk
          path: dist/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: test-apks
          retention-days: 7
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/update/FinTrack-99.0.0.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: app/build/reports/


  emulator:
    name: Emulator tests and screenshots
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FIREBASE_GOOGLE_SERVICES: ${{ secrets.FIREBASE_GOOGLE_SERVICES }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: test-apks
          path: apks

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Sets FIREBASE_PROJECT, which only later steps can see.
      - name: Firebase config
        run: bash .github/scripts/google-services.sh

      - name: Start the Firebase emulators
        run: |
          nohup npx --yes firebase-tools@13.29.1 emulators:start --only auth,firestore --project "$FIREBASE_PROJECT" > firebase-emulators.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -s -o /dev/null http://127.0.0.1:8080 && curl -s -o /dev/null http://127.0.0.1:9099; then echo "Emulators up"; exit 0; fi
            sleep 2
          done
          cat firebase-emulators.log
          exit 1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/emulator-checks.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            emulator-out/
            firebase-emulators.log

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, emulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: FinTrack-apk
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --title "FinTrack $GITHUB_REF_NAME" \
            --notes-file docs/release-notes.md
